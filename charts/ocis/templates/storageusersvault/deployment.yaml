{{- $usesChartAppVersion := and (empty .Values.image.tag) (empty .Values.image.sha) }}
{{- if and .Values.features.mfa.enabled $usesChartAppVersion (not (semverCompare ">=8.1.0-0" .Chart.AppVersion)) }}
{{- fail "features.mfa.enabled requires oCIS 8.1.0 or newer; set image.tag or image.sha explicitly, or use a chart with appVersion 8.1.0 or newer" }}
{{- end }}
{{- if and .Values.features.vault.enabled (not .Values.features.mfa.enabled) }}
{{- fail "features.mfa.enabled must be set to true when features.vault.enabled is set to true" }}
{{- end }}
{{- if .Values.features.vault.enabled }}
{{- include "ocis.basicServiceTemplates" (dict "scope" . "appName" "appNameStorageUsersVault" "appNameSuffix" "") -}}
{{- $vaultAutoscaling := mergeOverwrite (deepCopy .Values.autoscaling) .Values.services.storageusersvault.autoscaling -}}
apiVersion: apps/v1
kind: Deployment
{{ include "ocis.metadata" . }}
spec:
  {{- include "ocis.selector" . | nindent 2 }}
  {{- if and (not $vaultAutoscaling.enabled) (.Values.replicas) }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  {{- include "ocis.deploymentStrategy" . | nindent 2 }}
  template:
    {{- include "ocis.templateMetadata" (dict "scope" $ "configCheck" false) | nindent 4 }}
    spec:
      {{- include "ocis.affinity" $ | nindent 6 }}
      {{- include "ocis.securityContextAndtopologySpreadConstraints" . | nindent 6 }}
      {{- if and .Values.services.storageusersvault.persistence.enabled .Values.services.storageusersvault.persistence.chownInitContainer }}
      initContainers:
        - name: init-chown-data
          {{- include "ocis.initContainerImage" $ | nindent 10 }}
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
          {{- include "ocis.initChownDataCommand" $ | nindent 10 }}
          volumeMounts:
            - name: {{ include "ocis.persistence.dataVolumeName" . }}
              mountPath: /var/lib/ocis
      {{- end }}
      {{- include "ocis.priorityClassName" $.priorityClassName | nindent 6 }}
      {{- include "ocis.hostAliases" $ | nindent 6 }}
      nodeSelector: {{ toYaml $.nodeSelector | nindent 8 }}
      containers:
        - name: {{ .appName }}
          {{- include "ocis.image" $ | nindent 10 }}
          command: ["ocis"]
          args: ["storage-users", "server"]
          {{- include "ocis.containerSecurityContext" . | nindent 10 }}
          env:
            {{- include "ocis.serviceRegistry" . | nindent 12 }}
            {{- include "ocis.events" . | nindent 12 }}
            {{- include "ocis.cacheStore" . | nindent 12 }}
            {{- include "ocis.cors" . | nindent 12 }}

            - name: STORAGE_USERS_GATEWAY_GRPC_ADDR
              value: {{ .appNameGateway }}:9142

            - name: STORAGE_USERS_LOG_COLOR
              value: {{ .Values.logging.color | quote }}
            - name: STORAGE_USERS_LOG_LEVEL
              value: {{ .Values.logging.level | quote }}
            - name: STORAGE_USERS_LOG_PRETTY
              value: {{ .Values.logging.pretty | quote }}

            - name: STORAGE_USERS_TRACING_ENABLED
              value: {{ .Values.tracing.enabled | quote }}
            - name: STORAGE_USERS_TRACING_TYPE
              value: {{ .Values.tracing.type | quote }}
            - name: STORAGE_USERS_TRACING_ENDPOINT
              value: {{ .Values.tracing.endpoint | quote }}
            - name: STORAGE_USERS_TRACING_COLLECTOR
              value: {{ .Values.tracing.collector | quote }}

            - name: STORAGE_USERS_DEBUG_PPROF
              value: {{ .Values.debug.profiling | quote }}

            - name: STORAGE_USERS_ENABLE_VAULT_MODE
              value: "true"
            - name: STORAGE_USERS_SERVICE_NAME
              value: storage-users-vault
            - name: STORAGE_USERS_GRPC_ADDR
              value: 0.0.0.0:9285
            - name: STORAGE_USERS_HTTP_ADDR
              value: 0.0.0.0:9286
            - name: STORAGE_USERS_DATA_SERVER_URL
              value: "http://{{ .appName }}:9286/data"
            - name: STORAGE_USERS_DEBUG_ADDR
              value: 0.0.0.0:9287
            - name: STORAGE_USERS_OCIS_ROOT
              value: /var/lib/ocis/storage/users-vault
            - name: STORAGE_USERS_EVENTS_CONSUMER_GROUP
              value: vault-dcfs

            {{- if eq .Values.services.storageusersvault.storageBackend.driver "ocis" }}
            - name: STORAGE_USERS_DRIVER
              value: ocis
            - name: STORAGE_USERS_OCIS_MAX_CONCURRENCY
              value: {{ .Values.services.storageusersvault.storageBackend.driverConfig.ocis.maxConcurrency | quote }}
            {{- end }}

            {{- if eq .Values.services.storageusersvault.storageBackend.driver "s3ng" }}
            - name: STORAGE_USERS_DRIVER
              value: s3ng
            - name: STORAGE_USERS_S3NG_MAX_CONCURRENCY
              value: {{ .Values.services.storageusersvault.storageBackend.driverConfig.s3ng.maxConcurrency | quote }}
            - name: STORAGE_USERS_S3NG_ROOT
              value: /var/lib/ocis/storage/users-vault
            - name: STORAGE_USERS_S3NG_ENDPOINT
              value: {{ required "services.storageusersvault.storageBackend.driverConfig.s3ng.endpoint must be set when services.storageusersvault.storageBackend.driver is set to s3ng" .Values.services.storageusersvault.storageBackend.driverConfig.s3ng.endpoint | quote }}
            - name: STORAGE_USERS_S3NG_REGION
              value: {{ .Values.services.storageusersvault.storageBackend.driverConfig.s3ng.region | quote }}
            - name: STORAGE_USERS_S3NG_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "secrets.storageUsersVaultS3CredentialsSecret" . }}
                  key: accessKey
            - name: STORAGE_USERS_S3NG_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "secrets.storageUsersVaultS3CredentialsSecret" . }}
                  key: secretKey
            - name: STORAGE_USERS_S3NG_BUCKET
              value: {{ required "services.storageusersvault.storageBackend.driverConfig.s3ng.bucket must be set when services.storageusersvault.storageBackend.driver is set to s3ng" .Values.services.storageusersvault.storageBackend.driverConfig.s3ng.bucket | quote }}
            - name: STORAGE_USERS_S3NG_PUT_OBJECT_DISABLE_CONTENT_SHA256
              value: {{ .Values.services.storageusersvault.storageBackend.driverConfig.s3ng.disableContentSHA256 | quote }}
            - name: STORAGE_USERS_S3NG_PUT_OBJECT_DISABLE_MULTIPART
              value: {{ .Values.services.storageusersvault.storageBackend.driverConfig.s3ng.putObject.disableMultipart | quote }}
            - name: STORAGE_USERS_S3NG_PUT_OBJECT_SEND_CONTENT_MD5
              value: {{ .Values.services.storageusersvault.storageBackend.driverConfig.s3ng.putObject.sendContentMD5 | quote }}
            - name: STORAGE_USERS_S3NG_PUT_OBJECT_CONCURRENT_STREAM_PARTS
              value: {{ .Values.services.storageusersvault.storageBackend.driverConfig.s3ng.putObject.concurrentStreamParts | quote }}
            - name: STORAGE_USERS_S3NG_PUT_OBJECT_NUM_THREADS
              value: {{ .Values.services.storageusersvault.storageBackend.driverConfig.s3ng.putObject.numThreads | quote }}
            - name: STORAGE_USERS_S3NG_PUT_OBJECT_PART_SIZE
              value: {{ .Values.services.storageusersvault.storageBackend.driverConfig.s3ng.putObject.partSize | quote }}
            {{- end }}

            - name: STORAGE_USERS_UPLOAD_EXPIRATION
              value: {{ .Values.services.storageusers.maintenance.cleanUpExpiredUploads.uploadExpiration | quote }}
            - name: STORAGE_USERS_PURGE_TRASH_BIN_PERSONAL_DELETE_BEFORE
              value: {{ .Values.services.storageusers.maintenance.purgeExpiredTrashBinItems.personalDeleteBefore | quote }}
            - name: STORAGE_USERS_PURGE_TRASH_BIN_PROJECT_DELETE_BEFORE
              value: {{ .Values.services.storageusers.maintenance.purgeExpiredTrashBinItems.projectDeleteBefore | quote }}

            - name: STORAGE_USERS_SERVICE_ACCOUNT_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ include "config.authService" . }}
                  key: service-account-id
            - name: STORAGE_USERS_SERVICE_ACCOUNT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "secrets.serviceAccountSecret" . }}
                  key: service-account-secret

            - name: STORAGE_USERS_STAT_CACHE_STORE
              value: noop

            - name: STORAGE_USERS_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "secrets.jwtSecret" . }}
                  key: jwt-secret

            - name: OCIS_TRANSFER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "secrets.transferSecret" . }}
                  key: transfer-secret

            {{- if .Values.features.quotas.max }}
            - name: STORAGE_USERS_OCIS_MAX_QUOTA
              value: {{ .Values.features.quotas.max | quote }}
            {{- end }}

            - name: OCIS_ASYNC_UPLOADS
              value: "true"
            - name: STORAGE_USERS_EVENTS_NUM_CONSUMERS
              value: {{ .Values.services.storageusersvault.events.consumer.concurrency | quote }}
            - name: STORAGE_USERS_DATA_GATEWAY_URL
              value: "http://{{ .appNameFrontend }}:9140/data/"

            {{- include "ocis.caEnv" $ | nindent 12 }}

          {{- include "ocis.livenessProbe" . | nindent 10 }}

          resources: {{ toYaml .resources | nindent 12 }}

          ports:
            - name: grpc
              containerPort: 9285
            - name: http
              containerPort: 9286
            - name: metrics-debug
              containerPort: 9287

          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: messaging-system-ca
              mountPath: /etc/ocis/messaging-system-ca
              readOnly: true
            - name: {{ include "ocis.persistence.dataVolumeName" . }}
              mountPath: /var/lib/ocis
            {{- include "ocis.caPath" $ | nindent 12 }}

      {{- include "ocis.imagePullSecrets" $ | nindent 6 }}
      volumes:
        - name: tmp-volume
          emptyDir: {}
        - name: messaging-system-ca
          {{- if and .Values.messagingSystem.external.enabled (not .Values.messagingSystem.external.tls.certTrusted) }}
          secret:
            secretName: {{ include "secrets.messagingSystemCASecret" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- include "ocis.caVolume" $ | nindent 8 }}
        {{- include "ocis.persistence.dataVolume" . | nindent 8 }}
{{- end }}
