{{- if .Values.features.vault.enabled }}
{{- include "ocis.basicServiceTemplates" (dict "scope" . "appName" "appNameStorageUsersVault" "appNameSuffix" "") -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .appName }}
  namespace: {{ template "ocis.namespace" . }}
  labels:
    app: {{ .appName }}
    ocis-metrics: enabled
    {{- include "ocis.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ .appName }}
  ports:
    - name: grpc
      port: 9285
      protocol: TCP
      appProtocol: {{ .Values.service.appProtocol.grpc | quote }}
    - name: http
      port: 9286
      protocol: TCP
      appProtocol: {{ .Values.service.appProtocol.http | quote }}
    - name: metrics-debug
      port: 9287
      protocol: TCP
      appProtocol: {{ .Values.service.appProtocol.http | quote }}
{{- end }}
