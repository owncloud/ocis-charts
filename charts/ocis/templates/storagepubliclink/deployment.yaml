{{- $storagePubliclink := .Values.services.storagepubliclink -}}
{{- $bruteForce := $storagePubliclink.bruteForce -}}
{{- $store := $storagePubliclink.store -}}
{{- $storeSecretRef := .Values.secretRefs.storagepubliclinkStoreSecretRef -}}
{{- $customized := or (ne $bruteForce.timeGap "1h") (ne (int $bruteForce.maxAttempts) 5) (ne $store.database "storage-publiclink") (ne $store.table "brute-force-protection") (not (empty $storeSecretRef)) -}}
{{- $imageTag := default (default .Chart.AppVersion .Values.image.tag) $storagePubliclink.image.tag -}}
{{- $imageSHA := default .Values.image.sha $storagePubliclink.image.sha -}}
{{- if and $storeSecretRef (ne .Values.store.type "nats-js-kv") -}}
{{- fail "secretRefs.storagepubliclinkStoreSecretRef requires store.type=nats-js-kv" -}}
{{- end -}}
{{- if and $customized (empty $imageSHA) -}}
{{- if not (regexMatch `^v?[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$` $imageTag) -}}
{{- fail (printf "services.storagepubliclink brute-force and store settings require a semver-compatible oCIS 8.0.0 or newer storagepubliclink image tag or an explicit image SHA; effective storagepubliclink image tag %q cannot be verified" $imageTag) -}}
{{- end -}}
{{- if not (semverCompare ">=8.0.0-0" $imageTag) -}}
{{- fail (printf "services.storagepubliclink brute-force and store settings require oCIS 8.0.0 or newer; effective storagepubliclink image tag %q is too old" $imageTag) -}}
{{- end -}}
{{- end -}}
{{- include "ocis.basicServiceTemplates" (dict "scope" . "appName" "appNameStoragePubliclink" "appNameSuffix" "") -}}
apiVersion: apps/v1
kind: Deployment
{{ include "ocis.metadata" . }}
spec:
  {{- include "ocis.selector" . | nindent 2 }}
  {{- if and (not .Values.autoscaling.enabled) (.Values.replicas) }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  {{- include "ocis.deploymentStrategy" . | nindent 2 }}
  template:
    {{- include "ocis.templateMetadata" (dict "scope" $ "configCheck" false) | nindent 4 }}
    spec:
      {{- include "ocis.affinity" $ | nindent 6 }}
      {{- include "ocis.securityContextAndtopologySpreadConstraints" . | nindent 6 }}
      {{- include "ocis.priorityClassName" $.priorityClassName | nindent 6 }}
      {{- include "ocis.hostAliases" $ | nindent 6 }}
      nodeSelector: {{ toYaml $.nodeSelector | nindent 8 }}
      containers:
        - name: {{ .appName }}
          {{- include "ocis.image" $ | nindent 10 }}
          command: ["ocis"]
          args: ["storage-publiclink", "server"]
          {{- include "ocis.containerSecurityContext" . | nindent 10 }}
          env:
            {{- include "ocis.serviceRegistry" . | nindent 12 }}
            {{- include "ocis.persistentStore" . | nindent 12 }}
            {{- if $customized }}

            - name: STORAGE_PUBLICLINK_BRUTEFORCE_TIMEGAP
              value: {{ $bruteForce.timeGap | quote }}
            - name: STORAGE_PUBLICLINK_BRUTEFORCE_MAXATTEMPTS
              value: {{ $bruteForce.maxAttempts | quote }}
            - name: STORAGE_PUBLICLINK_STORE_DATABASE
              value: {{ $store.database | quote }}
            - name: STORAGE_PUBLICLINK_STORE_TABLE
              value: {{ $store.table | quote }}
            {{- if $storeSecretRef }}
            - name: STORAGE_PUBLICLINK_STORE_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "secrets.storagePubliclinkStore" . }}
                  key: username
            - name: STORAGE_PUBLICLINK_STORE_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "secrets.storagePubliclinkStore" . }}
                  key: password
            {{- end }}
            {{- end }}

            - name: STORAGE_PUBLICLINK_LOG_COLOR
              value: {{ .Values.logging.color | quote }}
            - name: STORAGE_PUBLICLINK_LOG_LEVEL
              value: {{ .Values.logging.level | quote }}
            - name: STORAGE_PUBLICLINK_LOG_PRETTY
              value: {{ .Values.logging.pretty | quote }}

            - name: STORAGE_PUBLICLINK_TRACING_ENABLED
              value: "{{ .Values.tracing.enabled }}"
            - name: STORAGE_PUBLICLINK_TRACING_TYPE
              value: {{ .Values.tracing.type | quote }}
            - name: STORAGE_PUBLICLINK_TRACING_ENDPOINT
              value: {{ .Values.tracing.endpoint | quote }}
            - name: STORAGE_PUBLICLINK_TRACING_COLLECTOR
              value: {{ .Values.tracing.collector | quote }}

            - name: STORAGE_PUBLICLINK_DEBUG_PPROF
              value: {{ .Values.debug.profiling | quote }}

            - name: STORAGE_PUBLICLINK_GRPC_ADDR
              value: 0.0.0.0:9178
            - name: STORAGE_PUBLICLINK_DEBUG_ADDR
              value: 0.0.0.0:9179

            - name: STORAGE_PUBLICLINK_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "secrets.jwtSecret" . }}
                  key: jwt-secret

            {{- include "ocis.caEnv" $ | nindent 12}}

          {{- include "ocis.livenessProbe" . | nindent 10 }}

          resources: {{ toYaml .resources | nindent 12 }}

          ports:
            - name: grpc
              containerPort: 9178
            - name: metrics-debug
              containerPort: 9179

          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            {{- include "ocis.caPath" $ | nindent 12}}

      {{- include "ocis.imagePullSecrets" $ | nindent 6 }}
      volumes:
        - name: tmp-volume
          emptyDir: {}
        {{- include "ocis.caVolume" $ | nindent 8}}
