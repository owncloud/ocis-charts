{{ if .Values.features.invitations.enabled }}
{{- include "ocis.basicServiceTemplates" (dict "scope" . "appName" "appNameInvitations" "appNameSuffix" "") -}}
apiVersion: apps/v1
kind: Deployment
{{ include "ocis.metadata" . }}
spec:
  {{- include "ocis.selector" . | nindent 2 }}
  {{- if and (not .Values.autoscaling.enabled) (.Values.replicas) }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  {{- include "ocis.deploymentStrategy" . | nindent 2 }}
  template:
    {{- include "ocis.templateMetadata" (dict "scope" $ "configCheck" false) | nindent 4 }}
    spec:
      {{- include "ocis.affinity" $ | nindent 6 }}
      {{- include "ocis.securityContextAndtopologySpreadConstraints" . | nindent 6 }}
      {{- include "ocis.priorityClassName" $.priorityClassName | nindent 6 }}
      {{- include "ocis.hostAliases" $ | nindent 6 }}
      nodeSelector: {{ toYaml $.nodeSelector | nindent 8 }}
      containers:
        - name: {{ .appName }}
          {{- include "ocis.image" $ | nindent 10 }}
          command: ["ocis"]
          args: ["invitations", "server"]
          {{- include "ocis.containerSecurityContext" . | nindent 10 }}
          env:
            {{- include "ocis.serviceRegistry" . | nindent 12 }}
            {{- include "ocis.cors" . | nindent 12 }}

            - name: INVITATIONS_LOG_COLOR
              value: {{ .Values.logging.color | quote }}
            - name: INVITATIONS_LOG_LEVEL
              value: {{ .Values.logging.level | quote }}
            - name: INVITATIONS_LOG_PRETTY
              value: {{ .Values.logging.pretty | quote }}

            - name: INVITATIONS_TRACING_ENABLED
              value: {{ .Values.tracing.enabled | quote }}
            - name: INVITATIONS_TRACING_TYPE
              value: {{ .Values.tracing.type | quote }}
            - name: INVITATIONS_TRACING_ENDPOINT
              value: {{ .Values.tracing.endpoint | quote }}
            - name: INVITATIONS_TRACING_COLLECTOR
              value: {{ .Values.tracing.collector | quote }}

            - name: INVITATIONS_DEBUG_PPROF
              value: {{ .Values.debug.profiling | quote }}

            - name: INVITATIONS_HTTP_ADDR
              value: 0.0.0.0:9265
            - name: INVITATIONS_DEBUG_ADDR
              value: 0.0.0.0:9269

            - name: INVITATIONS_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "secrets.jwtSecret" . }}
                  key: jwt-secret

            - name: INVITATIONS_KEYCLOAK_BASE_PATH
              value: {{ required "features.invitations.keycloak.basePath needs to be configured when features.invitations.enabled is set to true" .Values.features.invitations.keycloak.basePath | quote }}
            - name: INVITATIONS_KEYCLOAK_CLIENT_ID
              value: {{ required "features.invitations.keycloak.clientID needs to be configured when features.invitations.enabled is set to true" .Values.features.invitations.keycloak.clientID | quote }}
            - name: INVITATIONS_KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "secrets.invitationsKeycloakClientSecret" . }}
                  key: oidc-secret
            - name: INVITATIONS_KEYCLOAK_CLIENT_REALM
              value: {{ required "features.invitations.keycloak.clientRealm needs to be configured when features.invitations.enabled is set to true" .Values.features.invitations.keycloak.clientRealm | quote }}
            - name: INVITATIONS_KEYCLOAK_USER_REALM
              value: {{ required "features.invitations.keycloak.userRealm needs to be configured when features.invitations.enabled is set to true" .Values.features.invitations.keycloak.userRealm | quote }}
            - name: INVITATIONS_KEYCLOAK_INSECURE_SKIP_VERIFY
              value: {{ .Values.features.invitations.keycloak.insecure | quote }}

            {{- include "ocis.caEnv" $ | nindent 12}}

          {{- include "ocis.livenessProbe" . | nindent 10 }}

          resources: {{ toYaml .resources | nindent 12 }}

          ports:
            - name: http
              containerPort: 9265
            - name: metrics-debug
              containerPort: 9269

          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            {{- include "ocis.caPath" $ | nindent 12}}

      {{- include "ocis.imagePullSecrets" $ | nindent 6 }}
      volumes:
        - name: tmp-volume
          emptyDir: {}
        {{- include "ocis.caVolume" $ | nindent 8}}
{{ end }}
